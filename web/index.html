<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drafft.ink</title>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="An infinite canvas whiteboard. Draw first, sign up never.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
__PRELOAD__
<style>
  /* The page never scrolls. `100vh` is the height of the largest viewport on iOS and iPadOS Safari: with the toolbar
     showing, the lower part of a `100vh` canvas lies below the visible page, and the bottom bar with it. The canvas is
     pinned to the visible viewport instead (`position: fixed`), inside the safe-area insets (home indicator, notch,
     rounded corners; `viewport-fit=cover` in the meta tag makes the insets non-zero). */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f6f8; overscroll-behavior: none;
               -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  canvas { display: block; position: fixed; box-sizing: border-box; outline: none; touch-action: none; user-select: none;
           -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
           top: env(safe-area-inset-top, 0px);
           left: env(safe-area-inset-left, 0px);
           /* A canvas is a replaced element: opposite insets do not stretch it, so its size is stated. */
           width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
           height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; font: 16px/1.4 system-ui, sans-serif; color: #444; pointer-events: none; }
  #loading-progress { min-height: 1.4em; font-size: 13px; color: #777; font-variant-numeric: tabular-nums; }
  #loading .bar { width: 160px; height: 3px; border-radius: 2px; background: #ddd; overflow: hidden; }
  #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #6d4aff; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #failure { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
             font: 16px/1.5 system-ui, sans-serif; color: #222; background: #f6f6f8; text-align: center; }
  #failure pre { white-space: pre-wrap; color: #777; font-size: 13px; }
  #compat { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; max-width: min(36rem, calc(100vw - 24px));
            display: flex; gap: 10px; align-items: center; padding: 6px 8px 6px 12px; border-radius: 6px;
            font: 13px/1.35 system-ui, sans-serif; color: #5a3b00; background: #fff4d6; border: 1px solid #e8c874; }
  #compat button { all: unset; cursor: pointer; padding: 0 6px; font-size: 18px; line-height: 1; color: #5a3b00; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loading" role="status"><div>Loading Drafft.ink</div><div id="loading-progress" aria-live="off"></div><div class="bar"></div></div>
<div id="failure" role="alert"><div><h1>Drafft.ink could not start</h1>
  <p>Drafft.ink draws with WebGPU, or with WebGL2 when WebGPU is missing. Use a current Chrome, Edge, Firefox or Safari.</p><pre id="failure-detail"></pre></div></div>
<script>window.__assets = __ASSETS__;</script>
<script>
  // AGPL-3.0 section 13: the server that delivered this page says where its source code is. The About dialog reads
  // window.__source when it opens. Hosted without drafftink-server, there is no such file and the dialog shows the
  // project repository.
  fetch("/source.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => { if (j && typeof j.source_url === "string") window.__source = j.source_url; })
    .catch(() => {});
</script>
<script type="module">
  // The build script puts a hash in place of __BUILD__, so a new build never mixes with a cached old one.
  const BUILD = "__BUILD__";
  const fail = (e) => {
    console.error(e);
    window.__error = String(e);
    // The shell replaces the page with its own error page when WebGPU is missing; this covers the rest
    // (a failed download, an old browser without WebAssembly).
    if (document.getElementById("canvas")) {
      document.getElementById("loading").remove();
      document.getElementById("failure-detail").textContent = String((e && e.message) || e);
      document.getElementById("failure").style.display = "flex";
    }
  };
  // The wasm is the big download. Reading it through a stream lets the page say how far it is, as the old page did:
  // `N%` when the server gave the length, else the bytes so far. The bytes pass on unchanged to the streaming compiler.
  const progress = (loaded, total) => {
    const el = document.getElementById("loading-progress");
    if (!el) return;
    el.textContent = total > 0 ? `${Math.min(100, Math.floor((loaded / total) * 100))}%` : `${(loaded / 1048576).toFixed(1)} MB`;
    window.__loadProgress = { loaded, total };
  };
  const fetchWasm = async (url) => {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`could not load ${url}: ${response.status}`);
    if (!response.body) return response;
    const total = Number(response.headers.get("content-length")) || 0;
    let loaded = 0;
    progress(0, total);
    const counted = response.body.pipeThrough(new TransformStream({
      transform(chunk, controller) { loaded += chunk.byteLength; progress(loaded, total); controller.enqueue(chunk); },
    }));
    return new Response(counted, { status: response.status, headers: { "content-type": "application/wasm" } });
  };
  // Start-up marks in ms since navigation, for the perf driver (window.__marks).
  const mark = (name) => { (window.__marks ||= {})[name] = Math.round(performance.now()); };
  // Two builds of the app. `pkg` draws with WebGPU. `pkg-gl` draws with WebGL2 and is fetched only when the browser has
  // no WebGPU adapter (`?renderer=gl` forces it, `?renderer=gpu` forbids it), so the normal build is never slowed or grown by it.
  const BUILD_GL = "__BUILD_GL__";
  const adapterOk = async () => {
    try { return Boolean(navigator.gpu && await navigator.gpu.requestAdapter()); } catch (_) { return false; }
  };
  const forced = new URLSearchParams(location.search).get("renderer");
  const src = (renderer) => renderer === "webgl" ? ["pkg-gl", BUILD_GL] : ["pkg", BUILD];
  const importGlue = (renderer) => { const [dir, build] = src(renderer); return import(`./${dir}/drafftink_web.js?v=${build}`); };
  // The normal glue (a small script; the wasm comes later) is fetched while the adapter request runs, so the check costs no time.
  const early = !forced && navigator.gpu ? importGlue("webgpu") : null;
  early?.catch(() => {});
  const chooseRenderer = async () => {
    if (forced === "gl") return "webgl";
    if (forced === "gpu") return "webgpu";
    return (await adapterOk()) ? "webgpu" : "webgl";
  };
  const showCompatBanner = () => {
    const bar = document.createElement("div");
    bar.id = "compat";
    bar.setAttribute("role", "status");
    bar.textContent = "Compatibility mode: this browser has no WebGPU, so Drafft.ink draws with WebGL2. Large drawings are simpler and slower.";
    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "\u00d7";
    close.setAttribute("aria-label", "Dismiss");
    close.addEventListener("click", () => bar.remove());
    bar.append(close);
    document.body.append(bar);
  };
  try {
    const renderer = await chooseRenderer();
    window.__renderer = renderer;
    const [dir, build] = src(renderer);
    const glue = await (renderer === "webgpu" && early ? early : importGlue(renderer));
    mark("glue");
    await glue.default({ module_or_path: await fetchWasm(`./${dir}/drafftink_web_bg.wasm?v=${build}`) });
    mark("wasm");
    await glue.start("canvas");
    mark("started");
    // "Started" means the first frame is on screen. The poll ends there, so an idle page has no timer.
    const t0 = performance.now();
    while (window.drafftink.frames().frames === 0 && performance.now() - t0 < 60000) {
      await new Promise((r) => setTimeout(r, 50));
    }
    mark("first_frame");
    document.getElementById("loading")?.remove();
    if (renderer === "webgl") showCompatBanner();
    window.__started = window.drafftink.frames().frames > 0;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { fail(e); }

  // Offline use: the service worker keeps the app shell. Not on file:// or an insecure origin.
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register(window.__renderer === "webgl" ? "sw.js?r=webgl" : "sw.js").catch((e) => console.warn("service worker:", e));
  }
</script>
</body>
</html>
