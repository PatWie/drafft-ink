[package]
name = "drafftink-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink agent bridge (L6): JSON-RPC 2.0 over WebSocket, a loopback-only native server, the relay for the web page, and the agent tools generated from the command registry with MCP over HTTP."
readme = "README.md"
keywords = ["mcp", "json-rpc", "websocket", "agents", "whiteboard"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
# No schemas in the build: the web app fetches them as a file (docs/performance.md, "Wasm size"). The desktop apps and the
# tests turn them on again.
drafftink-engine = { path = "../engine", version = "0.2.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
subtle.workspace = true
base64.workspace = true

# The native server, the client and the relay. The core (rpc, core, host, guard) builds everywhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
getrandom = "0.3"
axum.workspace = true
# The official Rust MCP SDK, for the streamable HTTP server of the desktop app. No default features: the `#[tool]`
# macros are not used, because the tool list is generated from the command registry at run time.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio-util = "0.7"

[dev-dependencies]
# The tests draw with the hand-drawn fonts (the Git repository has them; a package on crates.io does not, and a path-only
# dev-dependency is not part of the package).
drafftink-typeset = { path = "../typeset", features = ["hand-fonts"] }
drafftink-engine = { path = "../engine", features = ["schemas"] }
tempfile.workspace = true
# An MCP client over streamable HTTP, to test the server of the desktop app with what a real client does.
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
