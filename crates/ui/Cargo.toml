[package]
name = "drafftink-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Drafft.ink egui user interface (L6): reads the command registry and the session and calls Session::execute_from. No document logic."
readme = "README.md"
keywords = ["egui", "whiteboard", "ui", "toolbar", "drawing"]
categories = ["gui", "graphics"]

[dependencies]
# No schemas in the build: the web app fetches them as a file (docs/performance.md, "Wasm size"). The desktop apps and the
# tests turn them on again.
drafftink-engine = { path = "../engine", version = "0.2.0", default-features = false }
drafftink-profile = { path = "../profile", version = "0.2.0" }
drafftink-scene = { path = "../scene", version = "0.2.0" }
drafftink-typeset = { path = "../typeset", version = "0.2.0", default-features = false }
egui = { workspace = true }
serde_json = { workspace = true }
# The library drawer decodes the PNG that `library.thumbnail` answers with. The app links both already.
base64 = { workspace = true }
png = { workspace = true }
thiserror = { workspace = true }

# egui's own fonts on the desktop; the web build loads them (theme::UiFont).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }

[dev-dependencies]
# The tests draw with the hand-drawn fonts (the Git repository has them; a package on crates.io does not, and a path-only
# dev-dependency is not part of the package).
drafftink-typeset = { path = "../typeset", features = ["hand-fonts"] }
drafftink-engine = { path = "../engine", features = ["schemas"] }
egui_kittest = { workspace = true }

[lints]
workspace = true
