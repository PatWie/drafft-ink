[package]
name = "drafftink-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The egui user interface (L6): reads the command registry and the session, calls Session::execute_from. No document logic."

[dependencies]
# No schemas in the build: the web app fetches them as a file (docs/performance.md, "Wasm size"). The desktop apps and the
# tests turn them on again.
drafftink-engine = { path = "../engine", default-features = false }
drafftink-scene = { path = "../scene" }
drafftink-typeset = { path = "../typeset", default-features = false }
egui = { workspace = true }
serde_json = { workspace = true }
# The library drawer decodes the PNG that `library.thumbnail` answers with. The app links both already.
base64 = { workspace = true }
png = { workspace = true }
thiserror = { workspace = true }

# egui's own fonts on the desktop; the web build loads them (theme::UiFont).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }

[dev-dependencies]
drafftink-engine = { path = "../engine", features = ["schemas"] }
egui_kittest = { workspace = true }

[lints]
workspace = true
