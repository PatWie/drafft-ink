[package]
name = "drafftink-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink GPU and shell (L6): the winit shell for native and web over two drawing back ends, Vello on wgpu and vello_gpu on WebGL2."
readme = "README.md"
keywords = ["wgpu", "vello", "winit", "webgl", "whiteboard"]
categories = ["graphics", "rendering::graphics-api", "gui"]

[features]
default = ["wgpu"]
# The Vello + wgpu back end (`Gpu`, `Compositor`, the surface). Every native build and the normal web build.
wgpu = ["dep:wgpu", "dep:egui-wgpu", "vello/default"]
# The WebGL2 back end for browsers without WebGPU (wasm32 only; on other targets it is only the pure replay code,
# which the unit tests use). The fallback web module is built with `--no-default-features --features webgl`.
webgl = ["dep:vello_gpu", "dep:glifo", "dep:egui_glow", "dep:glow"]

[dependencies]
drafftink-profile = { path = "../profile", version = "0.2.0" }
drafftink-render = { path = "../render", version = "0.2.0" }
egui = { workspace = true }
egui-wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, features = ["std", "wgsl"], optional = true }
vello_gpu = { workspace = true, optional = true }
glifo = { workspace = true, optional = true }
egui_glow = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
winit = { workspace = true, features = ["rwh_06"] }
vello = { workspace = true }
web-time = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
png = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui-winit = { version = "=0.37.0", default-features = false, features = ["x11", "wayland", "clipboard", "links"] }
wgpu = { workspace = true, features = ["parking_lot", "vulkan", "metal", "dx12"], optional = true }
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita", "rwh_06"] }
pollster = { workspace = true }
arboard = { workspace = true, features = ["wayland-data-control"] }
env_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No `clipboard`/`links` features: arboard and webbrowser do not exist on the web. The web host
# (src/web) supplies clipboard, links, IME and file drop.
egui-winit = { version = "=0.37.0", default-features = false }
wgpu = { workspace = true, features = ["webgpu"], optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "HtmlCanvasElement", "HtmlElement", "HtmlTextAreaElement", "Element", "Node", "NodeList",
    "Navigator", "Gpu", "Clipboard", "ClipboardEvent", "ClipboardItem", "DataTransfer", "DataTransferItem",
    "DataTransferItemList", "File", "FileList", "Blob", "BlobPropertyBag", "DragEvent", "Event", "EventTarget",
    "KeyboardEvent", "InputEvent", "CompositionEvent", "PointerEvent", "FocusEvent", "VisibilityState",
    "CssStyleDeclaration", "DomRect", "Performance", "Location", "console", "AddEventListenerOptions",
    "ResizeObserver", "MediaQueryList", "Permissions", "Url",
    "MouseEvent", "UiEvent", "FocusOptions", "HtmlHeadElement", "HtmlStyleElement",
    "WebGl2RenderingContext", "WebGlFramebuffer", "WebGlTexture", "WebglLoseContext",
] }

[dev-dependencies]
# A font for the glyph-run tests of the WebGL2 replay. Path only: a dev-dependency without a version is not published.
drafftink-typeset = { path = "../typeset", features = ["noto-sans"] }
wgpu = { workspace = true }
vello = { workspace = true }
pollster = { workspace = true }
env_logger = { workspace = true }

[[example]]
name = "demo"

# wasm32 only (the file is empty elsewhere): wasm-bindgen needs a cdylib.
[[example]]
name = "demo_web"
crate-type = ["cdylib"]

[lints]
workspace = true
