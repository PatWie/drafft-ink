[package]
name = "drafftink-app"
description = "The application glue (L7): one App for the desktop and the web. Owns the Session, the interaction layer, the UI and the render caches, and implements the shell's ShellApp."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["wgpu"]
# The Vello + wgpu renderer: every native build and the normal web module. The WebGL2 fallback module is built with
# `--no-default-features --features webgl` (`scripts/build-web.sh`), so it carries no wgpu code.
wgpu = ["drafftink-gpu/wgpu", "dep:wgpu"]
webgl = ["drafftink-gpu/webgl"]
# `perf::scene_for`: the generated scenes of the scenario drivers (`docs/performance.md` section 4). Off in shipped builds.
scenarios = ["drafftink-scene/scenegen"]

[dependencies]
drafftink-engine = { path = "../engine", default-features = false }
drafftink-canvas = { path = "../canvas" }
drafftink-geom = { path = "../geom" }
drafftink-scene = { path = "../scene" }
drafftink-typeset = { path = "../typeset" }
drafftink-render = { path = "../render" }
drafftink-edit = { path = "../edit" }
drafftink-profile = { path = "../profile" }
drafftink-collab = { path = "../collab" }
drafftink-bridge = { path = "../bridge" }
drafftink-gpu = { path = "../gpu", default-features = false }
drafftink-ui = { path = "../ui" }
egui = { workspace = true }
vello = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
png = { workspace = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }
arboard = { workspace = true, features = ["wayland-data-control"] }
getrandom = "0.3"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web platform (src/web): IndexedDB, downloads, file inputs, the async clipboard, crypto.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Navigator", "Location", "Element", "Node", "HtmlElement", "HtmlAnchorElement",
    "HtmlInputElement", "CssStyleDeclaration", "Event", "EventTarget", "File", "FileList", "Blob",
    "BlobPropertyBag", "Url", "Clipboard", "Crypto", "StorageManager", "DomException",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbObjectStoreParameters", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "VisibilityState", "Response",
] }

[dev-dependencies]
drafftink-engine = { path = "../engine", features = ["schemas"] }
drafftink-io = { path = "../io" }
drafftink-testkit = { path = "../testkit" }
# tests/fences reads the source of this crate and of drafftink-ui.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[lints]
workspace = true
