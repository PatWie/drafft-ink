[package]
name = "drafftink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Drafft.ink application glue (L7): one App for the desktop and the web. Owns the Session, the interaction layer, the UI and the render caches."
readme = "README.md"
keywords = ["whiteboard", "egui", "wgpu", "canvas", "drawing"]
categories = ["graphics", "gui"]

[features]
# The hand-drawn fonts (GelPen, GelPen Serif, Vanilla Extract) from the Git repository, not from crates.io: see
# `drafftink-typeset`. Without this feature those families are drawn with Noto Sans.
hand-fonts = ["drafftink-typeset/hand-fonts"]
default = ["wgpu"]
# The Vello + wgpu renderer: every native build and the normal web module. The WebGL2 fallback module is built with
# `--no-default-features --features webgl` (`scripts/build-web.sh`), so it carries no wgpu code.
wgpu = ["drafftink-gpu/wgpu", "dep:wgpu"]
webgl = ["drafftink-gpu/webgl"]
# `perf::scene_for`: the generated scenes of the scenario drivers (`docs/performance.md` section 4). Off in shipped builds.
scenarios = ["drafftink-scene/scenegen"]

[dependencies]
drafftink-engine = { path = "../engine", version = "0.2.0", default-features = false }
drafftink-canvas = { path = "../canvas", version = "0.2.0" }
drafftink-geom = { path = "../geom", version = "0.2.0" }
drafftink-scene = { path = "../scene", version = "0.2.0" }
drafftink-typeset = { path = "../typeset", version = "0.2.0" }
drafftink-render = { path = "../render", version = "0.2.0" }
drafftink-edit = { path = "../edit", version = "0.2.0" }
drafftink-profile = { path = "../profile", version = "0.2.0" }
drafftink-collab = { path = "../collab", version = "0.2.0" }
drafftink-bridge = { path = "../bridge", version = "0.2.0" }
drafftink-gpu = { path = "../gpu", version = "0.2.0", default-features = false }
drafftink-ui = { path = "../ui", version = "0.2.0" }
egui = { workspace = true }
vello = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true, features = ["default_fonts"] }
arboard = { workspace = true, features = ["wayland-data-control"] }
getrandom = "0.3"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web platform (src/web): IndexedDB, downloads, file inputs, the async clipboard, crypto.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Navigator", "Location", "Element", "Node", "HtmlElement", "HtmlAnchorElement",
    "HtmlInputElement", "CssStyleDeclaration", "Event", "EventTarget", "File", "FileList", "Blob",
    "BlobPropertyBag", "Url", "Clipboard", "Crypto", "StorageManager", "DomException",
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbObjectStoreParameters", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbTransactionMode", "IdbVersionChangeEvent", "VisibilityState", "Response",
] }

[[example]]
name = "media"
path = "examples/media/main.rs"
required-features = ["wgpu"]

[dev-dependencies]
png = { workspace = true }
# The tests draw with the hand-drawn fonts (the Git repository has them; a package on crates.io does not, and a path-only
# dev-dependency is not part of the package).
drafftink-typeset = { path = "../typeset", features = ["hand-fonts"] }
clap = { workspace = true }
tempfile = { workspace = true }
drafftink-engine = { path = "../engine", features = ["schemas"] }
drafftink-io = { path = "../io" }
drafftink-testkit = { path = "../testkit" }
# tests/fences reads the source of this crate and of drafftink-ui.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[lints]
workspace = true
