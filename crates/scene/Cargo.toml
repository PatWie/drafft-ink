[package]
name = "drafftink-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink scene model (L1): pure-data elements, fractional z-order, validation and the SceneStore trait with an in-memory store."
readme = "README.md"
keywords = ["whiteboard", "scene", "data-model", "canvas", "serde"]
categories = ["graphics", "data-structures"]

[features]
default = []
# Exposes `conformance`: a store-generic test suite that every SceneStore implementation must pass.
conformance = []
# Exposes `scenegen`: the deterministic scene generator of the perf scenarios, tests and benches (1k to 100k elements).
scenegen = []

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
drafftink-geom = { path = "../geom", version = "0.2.0" }
kurbo.workspace = true
peniko.workspace = true
schemars.workspace = true
smallvec.workspace = true
smol_str.workspace = true
base64.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
