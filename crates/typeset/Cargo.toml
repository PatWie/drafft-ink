[package]
name = "drafftink-typeset"
description = "Drafft.ink text and math layout: Parley text, ReX math, glyph runs, outlines, caret geometry, bounded caches"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Build the big fonts into the binary: Noto Sans (1.9 MB), IBM Plex Sans (0.5 MB), STIX Two Math (0.7 MB) and the five
# glyph-fallback fonts (0.5 MB). Without them the host
# loads them on demand (`Typesetter::wanted_fonts` and `provide_font`); the web app does that. The desktop
# app, the CLI and the tests build them in (`embedded`).
embedded = ["noto-sans", "plex-sans", "stix-math", "fallback-fonts"]
noto-sans = []
plex-sans = []
stix-math = []
# The glyph-fallback fonts (`ExtraFont::FALLBACKS`): symbols, math, Kannada, Arabic, CJK punctuation and kana.
fallback-fonts = []
# `bench_support`, for the benchmark only. The benchmark enables it through the dev-dependency on this crate.
bench = []

[dependencies]
drafftink-geom = { path = "../geom" }
drafftink-profile = { path = "../profile" }
kurbo = { workspace = true }
peniko = { workspace = true }
parley = { workspace = true }
thiserror = { workspace = true }
# ReX (math layout), pinned to the commit the old app used. It is a git dependency; see
# deny.toml `allow-git` and docs/typeset.md.
rex = { git = "https://github.com/KenyC/ReX", rev = "aeccdba38f3fa54195c469319b65c423e17a77ae", features = ["ttfparser-fontparser"] }
ttf-parser = "0.25"

[dev-dependencies]
criterion = { workspace = true }
# The benchmark needs `bench_support`; naming the crate here turns the feature on for tests and benches only.
drafftink-typeset = { path = ".", features = ["bench", "embedded"] }
proptest = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "typeset"
harness = false

[lints]
workspace = true
