[package]
name = "drafftink-typeset"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink text and math layout (L1): Parley text, ReX math, glyph runs, outlines, caret geometry and bounded caches."
readme = "README.md"
keywords = ["text-layout", "latex", "math", "parley", "typography"]
categories = ["text-processing", "graphics", "mathematics"]
build = "build.rs"
# The hand-drawn fonts are by Shara Weber, are not covered by the AGPL and are not part of any package on crates.io
# (docs/publishing.md). The feature `hand-fonts` needs them, so it only builds from the Git repository.
exclude = [
    "assets/fonts/GelPen*.ttf",
    "assets/fonts/VanillaExtract.ttf",
    "assets/licenses/GelPen-README.txt",
    "assets/licenses/VanillaExtract-license.txt",
]

[features]
default = []
# Build the big fonts into the binary: Noto Sans (1.9 MB), IBM Plex Sans (0.5 MB), STIX Two Math (0.7 MB) and the five
# glyph-fallback fonts (0.5 MB). Without them the host
# loads them on demand (`Typesetter::wanted_fonts` and `provide_font`); the web app does that. The desktop
# app, the CLI and the tests build them in (`embedded`).
embedded = ["noto-sans", "plex-sans", "stix-math", "fallback-fonts"]
noto-sans = []
plex-sans = []
stix-math = []
# The glyph-fallback fonts (`ExtraFont::FALLBACKS`): symbols, math, Kannada, Arabic, CJK punctuation and kana.
fallback-fonts = []
# The hand-drawn families GelPen, GelPen Serif and Vanilla Extract (Shara Weber, not AGPL; the files are in the Git repository
# only and the build fails without them). Without the feature those families are drawn with Noto Sans. The apps in this
# repository and the web build turn it on; a package from crates.io cannot.
hand-fonts = []
# `bench_support`, for the benchmark only. The benchmark enables it through the dev-dependency on this crate.
bench = []

[dependencies]
drafftink-geom = { path = "../geom", version = "0.2.0" }
drafftink-profile = { path = "../profile", version = "0.2.0" }
kurbo = { workspace = true }
peniko = { workspace = true }
parley = { workspace = true }
thiserror = { workspace = true }
# ReX (math layout), pinned to the commit the old app used. A crate on crates.io cannot have a Git dependency, so the copy
# is in third_party/rex and published as drafftink-rex (docs/typeset.md).
rex = { package = "drafftink-rex", path = "../../third_party/rex", version = "0.1.2", features = ["ttfparser-fontparser"] }
ttf-parser = "0.25"

[dev-dependencies]
criterion = { workspace = true }
# The benchmark needs `bench_support`; naming the crate here turns the feature on for tests and benches only.
drafftink-typeset = { path = ".", features = ["bench", "embedded"] }
proptest = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "typeset"
harness = false

[lints]
workspace = true
