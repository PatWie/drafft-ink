[package]
name = "drafftink-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command registry, Session, execute / execute_batch, refusals, gesture protocol and ports (L5)."

[dependencies]
drafftink-scene = { path = "../scene" }
drafftink-canvas = { path = "../canvas" }
drafftink-doc = { path = "../doc" }
drafftink-geom = { path = "../geom" }
drafftink-edit = { path = "../edit" }
drafftink-io = { path = "../io" }
drafftink-typeset = { path = "../typeset" }
drafftink-profile = { path = "../profile" }
drafftink-collab = { path = "../collab" }
drafftink-protocol = { path = "../protocol" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Names the key that failed when typed arguments are rejected (bad_args).
serde_path_to_error = "0.1"
base64.workspace = true

# The desktop build carries Noto Sans and STIX Two Math; the web build loads them on demand (docs/web-app.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
drafftink-typeset = { path = "../typeset", features = ["embedded"] }

[dev-dependencies]
drafftink-scene = { path = "../scene", features = ["conformance"] }
png.workspace = true
# Builds an update from a newer app for the schema-block tests.
loro.workspace = true

[lints]
workspace = true
