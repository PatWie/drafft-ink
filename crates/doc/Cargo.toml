[package]
name = "drafftink-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Loro-backed SceneStore: field-level CRDT schema, incremental sync, local undo, history trimming."

[features]
default = []
# Counts work in drafftink-profile counters (Counter::SyncOpsApplied) in addition to the store's own `WorkStats`.
profile = ["dep:drafftink-profile"]

[dependencies]
drafftink-scene = { path = "../scene" }
drafftink-profile = { path = "../profile", optional = true, default-features = false }
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
smallvec.workspace = true

[dev-dependencies]
drafftink-scene = { path = "../scene", features = ["conformance"] }
kurbo.workspace = true
proptest.workspace = true
criterion.workspace = true
base64.workspace = true
flate2 = "1"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }

[[bench]]
name = "store"
harness = false

[lints]
workspace = true
