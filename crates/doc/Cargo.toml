[package]
name = "drafftink-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Loro-backed SceneStore (L3): field-level CRDT schema, incremental sync, local undo and history trimming."
readme = "README.md"
keywords = ["crdt", "loro", "whiteboard", "collaboration", "undo"]
categories = ["data-structures", "network-programming"]

[features]
default = []
# Counts work in drafftink-profile counters (Counter::SyncOpsApplied) in addition to the store's own `WorkStats`.
profile = ["dep:drafftink-profile"]

[dependencies]
drafftink-scene = { path = "../scene", version = "0.2.0" }
drafftink-profile = { path = "../profile", version = "0.2.0", optional = true, default-features = false }
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
smallvec.workspace = true

[dev-dependencies]
drafftink-scene = { path = "../scene", features = ["conformance"] }
kurbo.workspace = true
proptest.workspace = true
criterion.workspace = true
base64.workspace = true
flate2 = "1"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh32"] }

[[bench]]
name = "store"
harness = false

[lints]
workspace = true
