[package]
name = "drafftink-sketch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hand-drawn (sketchy) path generation (L1): shapes in, kurbo paths with stroke and fill instructions out."
readme = "README.md"
keywords = ["sketchy", "hand-drawn", "vector-graphics", "roughjs", "whiteboard"]
categories = ["graphics", "rendering"]

[dependencies]
drafftink-geom = { path = "../geom", version = "0.2.0" }
kurbo.workspace = true
roughr.workspace = true

# roughr 0.14 depends on rand 0.8 -> getrandom 0.2, which does not compile for
# wasm32-unknown-unknown without a backend. This crate always seeds roughr explicitly, so the OS
# generator is never called; the feature only lets the dependency compile for the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "sketch"
harness = false

[lints]
workspace = true
