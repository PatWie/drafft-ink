[package]
name = "drafftink-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink scene encoding (L2): per-element Vello fragments, cache, culling, level of detail, grid and overlays."
readme = "README.md"
keywords = ["vello", "rendering", "whiteboard", "gpu", "canvas"]
categories = ["rendering", "graphics"]

[features]
default = []
# Pixel tests that render with Vello on a real GPU adapter and compare with tests/fixtures/render.
# They create a device in test code only; the library never does.
gpu-tests = ["dep:pollster", "vello/default"]

[dependencies]
drafftink-geom = { path = "../geom", version = "0.2.0" }
drafftink-profile = { path = "../profile", version = "0.2.0" }
drafftink-scene = { path = "../scene", version = "0.2.0" }
drafftink-sketch = { path = "../sketch", version = "0.2.0" }
drafftink-typeset = { path = "../typeset", version = "0.2.0" }
kurbo.workspace = true
peniko.workspace = true
vello.workspace = true
image.workspace = true
png.workspace = true
thiserror.workspace = true
pollster = { workspace = true, optional = true }

[dev-dependencies]
drafftink-typeset = { path = "../typeset", features = ["hand-fonts", "embedded"] }
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64.workspace = true

[[test]]
name = "gpu"
required-features = ["gpu-tests"]

[[bench]]
name = "compose"
harness = false

[lints]
workspace = true
