[package]
name = "drafftink-render"
description = "Drafft.ink scene encoding (L2): per-element Vello fragments, cache, culling, level of detail, grid, overlays"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Pixel tests that render with Vello on a real GPU adapter and compare with tests/fixtures/render.
# They create a device in test code only; the library never does.
gpu-tests = ["dep:pollster"]

[dependencies]
drafftink-geom = { path = "../geom" }
drafftink-profile = { path = "../profile" }
drafftink-scene = { path = "../scene" }
drafftink-sketch = { path = "../sketch" }
drafftink-typeset = { path = "../typeset" }
kurbo.workspace = true
peniko.workspace = true
vello.workspace = true
image.workspace = true
thiserror.workspace = true
pollster = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
png.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64.workspace = true

[[test]]
name = "gpu"
required-features = ["gpu-tests"]

[[bench]]
name = "compose"
harness = false

[lints]
workspace = true
