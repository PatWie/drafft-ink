[package]
name = "drafftink-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Drafft.ink collaboration client (L4): a sans-IO sync state machine, presence and WebSocket transports for native and web."
readme = "README.md"
keywords = ["collaboration", "crdt", "websocket", "sync", "whiteboard"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
drafftink-protocol = { path = "../protocol", version = "0.2.0" }
drafftink-doc = { path = "../doc", version = "0.2.0" }
drafftink-seal = { path = "../seal", version = "0.2.0" }
drafftink-scene = { path = "../scene", version = "0.2.0" }
drafftink-profile = { path = "../profile", version = "0.2.0", default-features = false }
log.workspace = true
loro.workspace = true
thiserror.workspace = true
serde_json.workspace = true
base64.workspace = true

# Native WebSocket: a background thread runs a small tokio runtime; rustls for wss.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs.workspace = true
webpki-roots.workspace = true
# Pictures as files: plain HTTP(S) on a few worker threads, the same rustls and ring as the WebSocket.
ureq = { workspace = true, features = ["rustls"] }

# Browser WebSocket.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "ErrorEvent",
    # Pictures: `fetch`.
    "Window", "Request", "RequestInit", "RequestMode", "RequestCache", "RequestRedirect", "Response", "Headers",
    "AbortSignal",
] }

[dev-dependencies]
drafftink-relay = { path = "../relay", version = "0.2.0" }
tempfile.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
