[package]
name = "drafftink-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Collaboration server library for Drafft.ink: WebSocket sync, room storage and a static web client. The program is drafftink-headless serve."
readme = "README.md"
keywords = ["collaboration", "websocket", "whiteboard", "crdt", "server"]
categories = ["network-programming", "web-programming::http-server", "web-programming::websocket"]

[lib]
name = "drafftink_server"
path = "src/lib.rs"

[features]
default = []
# SQLite room store (bundles SQLite, needs a C compiler).
sqlite = ["dep:rusqlite"]
# S3 room store (any S3-compatible endpoint).
s3 = ["dep:object_store"]

[dependencies]
drafftink-protocol = { path = "../../crates/protocol", version = "0.2.0" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
clap.workspace = true
loro.workspace = true
futures-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
serde_json.workspace = true
subtle.workspace = true
tungstenite.workspace = true
rusqlite = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }

[dev-dependencies]
# Only to check that SERVED_SCHEMA is the schema of the document crate.
drafftink-doc = { path = "../../crates/doc" }
tokio-tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
