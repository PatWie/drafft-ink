[package]
name = "drafftink-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Collaboration server for drafft.ink: WebSocket sync, room storage, static web client."
publish = false

[lib]
name = "drafftink_server"
path = "src/lib.rs"

[[bin]]
name = "drafftink-server"
path = "src/main.rs"

[features]
default = []
# SQLite room store (bundles SQLite, needs a C compiler).
sqlite = ["dep:rusqlite"]
# S3 room store (any S3-compatible endpoint).
s3 = ["dep:object_store"]

[dependencies]
drafftink-protocol = { path = "../../crates/protocol" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
clap.workspace = true
loro.workspace = true
futures-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
subtle.workspace = true
rusqlite = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }

[dev-dependencies]
# Only to check that SERVED_SCHEMA is the schema of the document crate.
drafftink-doc = { path = "../../crates/doc" }
tokio-tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
