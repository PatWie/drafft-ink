[package]
name = "drafftink-web"
description = "The web app: wasm entry point, window.drafftink (JS API) and the agent relay client. Native builds are empty."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "drafftink_web"
path = "src/lib.rs"
# cdylib for wasm-bindgen; rlib so that `cargo check --workspace` and the unit tests work natively.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "drafftink-web"
path = "src/main.rs"

[features]
default = ["wgpu"]
# The Vello + wgpu renderer: the normal web module (`dist/pkg`).
wgpu = ["drafftink-app/wgpu", "drafftink-gpu/wgpu"]
# The WebGL2 renderer for browsers without WebGPU: the fallback module (`dist/pkg-gl`), built with
# `--no-default-features --features webgl`. With both features the module picks at start-up.
webgl = ["drafftink-app/webgl", "drafftink-gpu/webgl"]
# The generated scenes of the perf scenarios (`window.drafftink.runScenario`, docs/performance.md section 5.3). Off in shipped builds.
scenarios = ["drafftink-app/scenarios"]

[dependencies]
# Pure parts, built and tested on every target.
drafftink-bridge = { path = "../../crates/bridge" }
drafftink-engine = { path = "../../crates/engine", default-features = false }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
drafftink-app = { path = "../../crates/app", default-features = false }
drafftink-gpu = { path = "../../crates/gpu", default-features = false }
drafftink-profile = { path = "../../crates/profile" }
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Storage", "Event", "EventTarget", "Navigator",
    "WebSocket", "MessageEvent", "CloseEvent", "BinaryType", "Performance",
] }

[dev-dependencies]
# The native unit tests build the WebMCP tool list, which describes the arguments of every command.
drafftink-engine = { path = "../../crates/engine", features = ["schemas"] }

[lints]
workspace = true
