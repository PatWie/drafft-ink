[package]
name = "drafftink"
description = "Drafft.ink for the desktop: an infinite canvas whiteboard."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "drafftink"
path = "src/main.rs"

[features]
# `--perf-scenario`: shows a generated scene for the perf gate (`cargo xtask perf --app native` builds with it). Off in
# every shipped build, because it replaces the open document outside a command (docs/exceptions.md, N4).
scenarios = ["drafftink-app/scenarios"]

[dependencies]
drafftink-app = { path = "../../crates/app" }
drafftink-bridge = { path = "../../crates/bridge" }
drafftink-engine = { path = "../../crates/engine" }
drafftink-gpu = { path = "../../crates/gpu" }
drafftink-profile = { path = "../../crates/profile" }
clap = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[build-dependencies]
embed-resource = { workspace = true }
