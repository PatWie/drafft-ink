[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "e2e/native", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.91"

[workspace.dependencies]
# ---- Graphics / UI stack: ONE compatible set, pinned by the stack spike (docs/stack.md). ----
# Keep these in lockstep. eframe/egui-wgpu 0.37 and vello 0.11 both use wgpu 30; vello 0.11 and
# parley 0.12 both use peniko 0.6 / kurbo 0.13 / linebender_resource_handle 0.1. Bump together or not at all.
kurbo = { version = "0.13", features = ["serde"] }
peniko = "=0.6.1"
# No default features: `vello/default` is the wgpu renderer (and wgpu's own defaults). Only `drafftink-gpu`'s `wgpu`
# feature turns it on, so the WebGL2 fallback module carries the scene types and none of the renderer.
vello = { version = "=0.11.0", default-features = false }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# wgpu: no default features. The crate that owns the device (gpu) picks backends per target:
#   native: ["std", "parking_lot", "wgsl", "vulkan", "gles", "metal", "dx12"]; wasm32: ["std", "wgsl", "webgpu"].
# Never enable `webgl` (egui-wgpu does by default): Vello needs compute, and webgl adds naga + a GL backend (+0.6 MB brotli).
wgpu = { version = "=30.0.1", default-features = false }
# No `default_fonts` here: they are 1 MB of the web build. The crates that draw text on the desktop turn the feature
# on for non-wasm targets (crates/ui, app, gpu); the web app loads the files instead (`drafftink_ui::theme::UiFont`).
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland"] }
egui_kittest = { version = "=0.37.0", default-features = false }
winit = "0.30.13"
# The WebGL2 fallback (crates/gpu feature `webgl`): vello_gpu draws with WebGL2, egui_glow paints egui. vello_gpu 0.3 shares
# kurbo 0.13 and peniko 0.6 with vello 0.11 and parley 0.12, so the scene's types are the same on both back ends.
vello_gpu = { version = "=0.3.0", default-features = false, features = ["webgl", "text", "std"] }
glifo = { version = "0.4", default-features = false, features = ["std"] }
egui_glow = { version = "=0.37.0", default-features = false }
glow = "0.17"

# ---- Document, sync, geometry helpers ----
loro = "1.17"
roughr = "0.14"
rstar = "0.14"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# scene (L1) data model
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18"
web-time = "1"

# ---- Platform glue ----
wasm-bindgen = "=0.2.130" # must equal the installed wasm-bindgen-cli version
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
env_logger = "0.11"
pollster = "0.4"
rfd = "0.18"
arboard = "3"
# Windows resource (icon, version) for the desktop exe: apps/drafftink/build.rs
embed-resource = "3"

# ---- Server (apps/drafftink-server) ----
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rusqlite = { version = "0.41", features = ["bundled"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
subtle = "2"
tokio-tungstenite = "0.30"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false }
# The version axum's WebSocket support uses: the server downcasts its errors to this type.
tungstenite = { version = "0.29", default-features = false }
tempfile = "3"

# ---- Test / bench ----
proptest = "1"
insta = "1"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# `cargo build --release` is the build for development and for the perf gates. `strip` removes the symbol tables
# (8 MB of 55 MB). Unwinding stays on: the executor turns a panic in a command into a refusal.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The binaries that are shipped (`scripts/package-*`, `cargo xtask size --native`): fat LTO lets the linker drop what
# no binary of the workspace calls, and the packages below, which run on a command, a message or a file and not
# per frame, are optimised for size as in the wasm profile. 55.2 MB became 41.4 MB, and 46.9 MB with only `strip`
# (`docs/performance.md` section 8.3). The build takes about twice as long, which is why it is not `release`.
[profile.dist]
inherits = "release"
lto = "fat"

[profile.dist.package.loro]
opt-level = "s"

[profile.dist.package.loro-internal]
opt-level = "s"

[profile.dist.package.loro-common]
opt-level = "s"

[profile.dist.package.loro-rle]
opt-level = "s"

[profile.dist.package.loro-delta]
opt-level = "s"

[profile.dist.package.generic-btree]
opt-level = "s"

[profile.dist.package.serde_columnar]
opt-level = "s"

[profile.dist.package.serde_json]
opt-level = "s"

[profile.dist.package.serde_path_to_error]
opt-level = "s"

[profile.dist.package.schemars]
opt-level = "s"

[profile.dist.package.rmcp]
opt-level = "s"

[profile.dist.package.zune-jpeg]
opt-level = "s"

[profile.dist.package.image-webp]
opt-level = "s"

[profile.dist.package.image]
opt-level = "s"

[profile.dist.package.png]
opt-level = "s"

[profile.dist.package.fdeflate]
opt-level = "s"

[profile.dist.package.miniz_oxide]
opt-level = "s"

[profile.dist.package.rustls]
opt-level = "s"

[profile.dist.package.base64]
opt-level = "s"

# `cargo xtask size` compresses a 12 MB module at brotli quality 11; unoptimised that takes minutes.
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Loading 100,000 elements into a tab document is 770,000 field inserts into Loro: 29 s with Loro unoptimised in a
# test run, a tenth of that with it optimised (`docs/performance.md`, section 7.9).
[profile.dev.package.loro]
opt-level = 3

[profile.dev.package.loro-internal]
opt-level = 3

[profile.dev.package.loro-common]
opt-level = 3

[profile.dev.package.loro-rle]
opt-level = 3

[profile.dev.package.loro-delta]
opt-level = 3

[profile.dev.package.generic-btree]
opt-level = 3

[profile.dev.package.serde_columnar]
opt-level = 3

[profile.release-wasm]
inherits = "release"
# The wasm module keeps its names: it is not stripped here (wasm-opt and wasm-bindgen handle it).
strip = "none"
# "s" for the code that runs every frame (egui, vello, kurbo, the render, canvas and ui crates) and "z" for the code that
# runs on a command, a message or a file (the table below). "z" everywhere is 6% smaller, but the frame is 20 to 40%
# slower: the UI phase of the pan scenario goes from 2.8 to 3.2 to 3.9 ms (docs/performance.md, "Wasm size").
opt-level = "s"
lto = "fat"
panic = "abort"

# Cold code: the command engine, file formats, the CRDT, serialisation, image decoders and the browser glue.
[profile.release-wasm.package.loro]
opt-level = "z"

[profile.release-wasm.package.loro-internal]
opt-level = "z"

[profile.release-wasm.package.loro-common]
opt-level = "z"

[profile.release-wasm.package.loro-rle]
opt-level = "z"

[profile.release-wasm.package.loro-delta]
opt-level = "z"

[profile.release-wasm.package.generic-btree]
opt-level = "z"

[profile.release-wasm.package.serde_columnar]
opt-level = "z"

[profile.release-wasm.package.serde_json]
opt-level = "z"

[profile.release-wasm.package.serde]
opt-level = "z"

[profile.release-wasm.package.schemars]
opt-level = "z"

[profile.release-wasm.package.drafftink-engine]
opt-level = "z"

[profile.release-wasm.package.drafftink-io]
opt-level = "z"

[profile.release-wasm.package.drafftink-doc]
opt-level = "z"

[profile.release-wasm.package.drafftink-collab]
opt-level = "z"

[profile.release-wasm.package.drafftink-protocol]
opt-level = "z"

[profile.release-wasm.package.drafftink-bridge]
opt-level = "z"

[profile.release-wasm.package.wgpu]
opt-level = "z"

[profile.release-wasm.package.wgpu-core]
opt-level = "z"

[profile.release-wasm.package.wgpu-hal]
opt-level = "z"

[profile.release-wasm.package.naga]
opt-level = "z"

[profile.release-wasm.package.winit]
opt-level = "z"

[profile.release-wasm.package.zune-jpeg]
opt-level = "z"

[profile.release-wasm.package.zune-core]
opt-level = "z"

[profile.release-wasm.package.image-webp]
opt-level = "z"

[profile.release-wasm.package.image]
opt-level = "z"

[profile.release-wasm.package.png]
opt-level = "z"

[profile.release-wasm.package.fdeflate]
opt-level = "z"

[profile.release-wasm.package.miniz_oxide]
opt-level = "z"

[profile.release-wasm.package.base64]
opt-level = "z"

[profile.release-wasm.package.postcard]
opt-level = "z"

[profile.release-wasm.package.web-sys]
opt-level = "z"

[profile.release-wasm.package.js-sys]
opt-level = "z"

[profile.release-wasm.package.wasm-bindgen]
opt-level = "z"
