[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.91"

[workspace.dependencies]
# ---- Graphics / UI stack: ONE compatible set, pinned by the stack spike (docs/stack.md). ----
# Keep these in lockstep. eframe/egui-wgpu 0.37 and vello 0.11 both use wgpu 30; vello 0.11 and
# parley 0.12 both use peniko 0.6 / kurbo 0.13 / linebender_resource_handle 0.1. Bump together or not at all.
kurbo = { version = "0.13", features = ["serde"] }
peniko = "=0.6.1"
vello = { version = "=0.11.0", default-features = true }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# wgpu: no default features. The crate that owns the device (gpu) picks backends per target:
#   native: ["std", "parking_lot", "wgsl", "vulkan", "gles", "metal", "dx12"]; wasm32: ["std", "wgsl", "webgpu"].
# Never enable `webgl` (egui-wgpu does by default): Vello needs compute, and webgl adds naga + a GL backend (+0.6 MB brotli).
wgpu = { version = "=30.0.1", default-features = false }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland"] }
egui_kittest = { version = "=0.37.0", default-features = false }
winit = "0.30.13"

# ---- Document, sync, geometry helpers ----
loro = "1.17"
roughr = "0.14"
rstar = "0.14"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# scene (L1) data model
smallvec = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18"
web-time = "1"

# ---- Platform glue ----
wasm-bindgen = "=0.2.130" # must equal the installed wasm-bindgen-cli version
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
env_logger = "0.11"
pollster = "0.4"
rfd = "0.18"
arboard = "3"

# ---- Server (apps/drafftink-server) ----
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rusqlite = { version = "0.41", features = ["bundled"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
subtle = "2"
tokio-tungstenite = "0.30"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false }
# The version axum's WebSocket support uses: the server downcasts its errors to this type.
tungstenite = { version = "0.29", default-features = false }
tempfile = "3"

# ---- Test / bench ----
proptest = "1"
insta = "1"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
