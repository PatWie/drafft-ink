# The two end-to-end suites that drive the real apps: the browser (Playwright, headed Chromium on Xvfb, WebGPU) and the
# native app through the agent bridge. They need a display and an adapter, so they are NOT part of the required `ci`
# aggregate (.github/workflows/ci.yml) and are not run by `cargo xtask ci`. Run them with `cargo xtask e2e`.
#
# Where they run:
#  * workflow_dispatch, nightly, and pull requests that touch the apps or the suites;
#  * on a runner with an NVIDIA GPU when the repository has one (the `gpu` self-hosted label), with
#    DRAFFTINK_REQUIRE_GPU=1 so that a missing adapter fails;
#  * on a hosted runner with Chromium's SwiftShader adapter otherwise (slow, but it checks the same stories).
name: E2E

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: ubuntu-24.04 (SwiftShader) or gpu (self-hosted with an NVIDIA GPU)"
        default: ubuntu-24.04
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "src/**"
      - "crates/**"
      - "third_party/**"
      - "e2e/**"
      - "web/**"
      - "xtask/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  e2e:
    name: E2E (browser and native)
    # Pinned to 24.04 on 2026-11-13: `ubuntu-latest` became ubuntu-26.04, and Playwright 1.58 (e2e/web/package.json) stops
    # at "does not support chromium on ubuntu26.04-x64". Playwright supports 26.04 from 1.61 on. Remove the pin when
    # the suites move to that version.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      # On a hosted runner there is no GPU: Chromium falls back to SwiftShader, and the native app to Mesa's software
      # Vulkan (lavapipe). On the `gpu` runner the real adapter is required.
      DRAFFTINK_E2E_ADAPTER: ${{ (inputs.runner == 'gpu') && 'nvidia' || 'swiftshader' }}
      # Both runners have an adapter (the GPU, or Chromium's SwiftShader and Mesa's lavapipe, installed below), so a
      # missing one is a failure and not a skip.
      DRAFFTINK_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          # libxkbcommon-x11-0 and the X11 client libraries are loaded at run time (dlopen) by the native app's window
          # library; without them `drafftink --bridge` panics at start ("libxkbcommon-x11.so could not be loaded").
          sudo apt-get install -y xvfb xclip mesa-vulkan-drivers libvulkan1 binaryen \
            libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
      - name: wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)" --locked
      - name: Playwright Chromium
        working-directory: e2e/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run both suites
        run: cargo xtask e2e
      # The GPU pixel tests and the scenarios that need an adapter print `SKIPPED:` and pass on a machine without one;
      # here DRAFFTINK_REQUIRE_GPU=1 turns that into a failure, and the summary line says how many tests skipped.
      - name: GPU tests (render, app, testkit)
        run: cargo xtask test
      - name: Keep the reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: |
            target/e2e/summary.json
            e2e/web/results/report.json
            e2e/web/results/artifacts/
          if-no-files-found: ignore
