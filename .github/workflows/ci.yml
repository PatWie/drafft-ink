# One required check: `ci` (the last job). Each job runs one `cargo xtask` gate, so a failure
# reproduces locally with the same command. `cargo xtask ci` runs them all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must equal rust-toolchain.toml (`cargo xtask standards` checks).
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo xtask fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask clippy

  layers:
    name: Layers and standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # standards compares the shrink-only lists with origin/main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask layers
      - run: cargo xtask standards
        env:
          XTASK_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}

  wasm:
    name: Wasm check (L0-L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask wasm

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo xtask test

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask deny

  # Supply-chain cooldown: a locked crates.io version must be at least 7 days old.
  # Ported from the old repo (utils/quarantine_check.py). Allowlist: utils/quarantine_allow.txt.
  quarantine:
    name: Dependency age gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish dates never change, so the cache survives lockfile changes: a new
      # lockfile restores the old cache and only fetches the new versions.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/drafftink-quarantine
          key: ${{ runner.os }}-quarantine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quarantine-
      - run: python3 utils/quarantine_check.py --min-age-days 7

  # The desktop app, the MCP server and the collaboration server on all three desktop systems.
  # Linux needs no -dev packages: winit loads X11, Wayland and xkbcommon with dlopen, rusqlite is
  # bundled, and the fonts are in the binary (docs/building.md). Only a C compiler is needed, and
  # every runner has one. Windows needs the MSVC tools (preinstalled) for the icon resource in
  # apps/drafftink/build.rs.
  build-native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --workspace --release --locked
      # A stub main() or a missing resource fails here.
      - name: Run every binary with --version
        shell: bash
        run: |
          for bin in drafftink drafftink-mcp drafftink-server; do
            ./target/release/$bin --version
          done

  # The Linux packaging script, end to end (tar.gz, .deb, AppImage), on the oldest runner image.
  # macOS and Windows packaging run in release.yml; they are not exercised here.
  packaging:
    name: Packaging (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: packaging
      - name: Lint the packaging scripts
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          shellcheck --severity=warning scripts/package-*.sh packaging/env.sh packaging/linux/AppRun
          python3 -c "import plistlib; plistlib.load(open('packaging/macos/entitlements.plist','rb'))"
      - run: scripts/package-linux.sh --formats "tar deb appimage"

  # The web app as it is released (release-wasm, wasm-bindgen, wasm-opt), and its size against perf/budgets.json.
  # A separate job: the build takes several minutes on a runner, which is too long for the local `cargo xtask ci`
  # loop to wait for on every push of a branch, but the job reproduces locally with the same command.
  # Needs brotli (the build script measures with it), wasm-bindgen-cli at the version of Cargo.toml and
  # binaryen 133 (the build script's wasm-opt feature list was checked with it).
  size:
    name: Size (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen, brotli and binaryen
        run: |
          # rust-cache keeps ~/.cargo/bin, so the install happens once per cache.
          command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.130 --locked
          sudo apt-get update && sudo apt-get install -y brotli
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: cargo xtask size
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          # dist/ is what a server serves. The other file still has its function names: `twiggy top -n 40 <file>`
          # lists the biggest items when the size budget fails.
          path: |
            dist
            target/wasm32-unknown-unknown/release-wasm/drafftink_web.wasm
          retention-days: 7

  # The single required check. Branch protection requires only this job.
  # `if: always()` makes it report even when an earlier job failed or was cancelled;
  # a job that did not succeed fails the aggregate.
  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, layers, wasm, test, deny, quarantine, build-native, packaging, size]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
